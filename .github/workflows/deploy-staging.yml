name: Deploy to Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Prepare Theme Folder
        run: |
          mkdir deploy_folder
          cp -r functions.php style.css inc JS acf-json deploy_folder/

      - name: Sync to Staging Server
        run: |
          sudo apt-get install -y lftp
          lftp -c "set sftp:auto-confirm yes; open -u ${{ secrets.STAGING_SFTP_USERNAME }},${{ secrets.STAGING_SFTP_PASSWORD }} sftp://sftp.wp.com:22; mirror -R ./deploy_folder/ htdocs/wp-content/themes/twentytwentytwo-child/"