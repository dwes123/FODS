name: Deploy to Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Prepare Theme Folder
        run: |
          mkdir deploy_folder
          cp -r functions.php style.css inc JS acf-json deploy_folder/

      - name: Sync to Staging Server
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          server: sftp.wp.com
          port: 22
          local_path: './deploy_folder/*'
          remote_path: 'htdocs/wp-content/themes/twentytwentytwo-child/'
          sftpArgs: '-o StrictHostKeyChecking=no'