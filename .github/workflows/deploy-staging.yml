name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Prepare Theme Folder (Remove non-theme files)
        run: |
          rm -rf .git
          rm -rf .github
          rm -rf Python
          rm -rf mobile_app
          rm -rf .idea
          rm -rf ScreenShots
          rm -f deploy_to_staging.ps1
          rm -f README.md

      - name: Sync to Staging Server
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.STAGING_SFTP_USERNAME }}
          server: sftp.wp.com
          password: ${{ secrets.STAGING_SFTP_PASSWORD }}
          port: 22
          local_path: './'
          remote_path: 'htdocs/wp-content/themes/twentytwentytwo-child/'
          sftp_only: true
