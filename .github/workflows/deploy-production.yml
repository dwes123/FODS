name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Prepare Theme Folder
        run: |
          mkdir deploy_folder
          cp -r functions.php style.css inc JS acf-json deploy_folder/

      - name: Sync to Production Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: sftp.wp.com
          username: ${{ secrets.PROD_SFTP_USERNAME }}
          password: ${{ secrets.PROD_SFTP_PASSWORD }}
          protocol: sftp
          port: 22
          local-dir: ./deploy_folder/
          server-dir: htdocs/wp-content/themes/twentytwentytwo-child/