name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Sync to Production Server (SFTP)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.PROD_SFTP_USERNAME }}
          server: sftp.wp.com
          password: ${{ secrets.PROD_SFTP_PASSWORD }}
          port: 22
          local_path: './'
          remote_path: 'htdocs/wp-content/themes/twentytwentytwo-child/'
          args: '-o ConnectTimeout=5'
          delete_remote_files: false
          exclude: |
            .git*
            .github*
            Python/
            mobile_app/
            deploy_to_staging.ps1
            README.md
            .idea/
            ScreenShots/