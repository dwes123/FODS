name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Sync to Production Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: sftp.wp.com
          username: ${{ secrets.PROD_SFTP_USERNAME }}
          password: ${{ secrets.PROD_SFTP_PASSWORD }}
          protocol: sftp
          port: 22
          local-dir: ./
          server-dir: htdocs/wp-content/themes/twentytwentytwo-child/
          exclude: |
            **/.git*
            **/.github**
            **/Python/**
            **/mobile_app/**
            deploy_to_staging.ps1
            README.md
